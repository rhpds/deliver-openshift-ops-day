---
- name: Try the cluster-hosted virtctl route
  block:
  - name: Download virtctl cli tool
    delegate_to: "{{ groups['bastions'][0] }}"
    ansible.builtin.get_url:
      url: "{{ _ocp4_workload_openshift_virtualization_virtctl_url }}"
      validate_certs: "{{ ocp4_workload_openshift_virtualization_virtctl_validate_certs }}"
      dest: /tmp/virtctl.tar.gz
      mode: "0660"
      force: true
      timeout: "{{ ocp4_workload_openshift_virtualization_virtctl_download_timeout }}"
    register: r_virtctl
    until: r_virtctl is succeeded
    retries: "{{ ocp4_workload_openshift_virtualization_virtctl_download_retries }}"
    delay: "{{ ocp4_workload_openshift_virtualization_virtctl_download_delay }}"

  - name: Validate the route-provided virtctl archive
    ansible.builtin.include_tasks: validate_virtctl_archive.yml

  rescue:
  - name: Explain the virtctl download fallback
    ansible.builtin.debug:
      msg: "The virtctl route or archive is unavailable; trying the same archive through the Kubernetes API service proxy."

  - name: Require API credentials for the virtctl fallback
    ansible.builtin.assert:
      that:
      - openshift_api_url | default('') | length > 0
      - openshift_api_key | default('') | length > 0
      quiet: true
      fail_msg: "The virtctl API fallback requires openshift_api_url and openshift_api_key."
    no_log: true

  # Route hosts are not resource names: the generated host normally contains
  # both route name and namespace, and custom hosts need not resemble either.
  - name: Find the virtctl route backend
    kubernetes.core.k8s_info:
      api_version: route.openshift.io/v1
      kind: Route
      namespace: openshift-cnv
    register: _virtctl_route_query
    vars:
      _virtctl_matching_routes: >-
        {{ _virtctl_route_query.resources | default([])
           | selectattr('spec.host', 'defined')
           | selectattr('spec.host', 'equalto',
               _ocp4_workload_openshift_virtualization_virtctl_url | urlsplit('hostname'))
           | list }}
    until:
    - _virtctl_route_query is succeeded
    - _virtctl_matching_routes | length == 1
    retries: "{{ ocp4_workload_openshift_virtualization_virtctl_backend_wait_retries }}"
    delay: "{{ ocp4_workload_openshift_virtualization_virtctl_backend_wait_delay }}"

  - name: Select the Route matching the advertised virtctl hostname
    ansible.builtin.set_fact:
      r_virtctl_route:
        resources: >-
          {{ _virtctl_route_query.resources
             | selectattr('spec.host', 'defined')
             | selectattr('spec.host', 'equalto',
                 _ocp4_workload_openshift_virtualization_virtctl_url | urlsplit('hostname'))
             | list }}

  - name: Require a Service backend for the virtctl route
    ansible.builtin.assert:
      that:
      - r_virtctl_route.resources[0].spec.to.kind | default('Service') == 'Service'
      - r_virtctl_route.resources[0].spec.to.name | default('') | length > 0
      fail_msg: "The advertised virtctl route must target a Service in openshift-cnv."

  - name: Find the virtctl download service
    kubernetes.core.k8s_info:
      api_version: v1
      kind: Service
      name: "{{ r_virtctl_route.resources[0].spec.to.name }}"
      namespace: openshift-cnv
    register: r_virtctl_service
    until:
    - r_virtctl_service is succeeded
    - r_virtctl_service.resources | default([]) | length == 1
    - r_virtctl_service.resources[0].spec.ports | default([]) | length > 0
    retries: "{{ ocp4_workload_openshift_virtualization_virtctl_backend_wait_retries }}"
    delay: "{{ ocp4_workload_openshift_virtualization_virtctl_backend_wait_delay }}"

  - name: Wait for a ready virtctl download backend
    kubernetes.core.k8s_info:
      api_version: discovery.k8s.io/v1
      kind: EndpointSlice
      namespace: openshift-cnv
      label_selectors:
      - "kubernetes.io/service-name={{ r_virtctl_service.resources[0].metadata.name }}"
    register: _virtctl_endpoint_slices
    vars:
      _virtctl_ready_addresses: >-
        {{ _virtctl_endpoint_slices.resources | default([])
           | selectattr('endpoints', 'defined') | map(attribute='endpoints') | flatten
           | selectattr('conditions.ready', 'defined')
           | selectattr('conditions.ready', 'equalto', true)
           | selectattr('addresses', 'defined') | map(attribute='addresses') | flatten }}
    until:
    - _virtctl_endpoint_slices is succeeded
    - _virtctl_ready_addresses | length > 0
    retries: "{{ ocp4_workload_openshift_virtualization_virtctl_backend_wait_retries }}"
    delay: "{{ ocp4_workload_openshift_virtualization_virtctl_backend_wait_delay }}"

  # A Route targetPort names a Service targetPort (or port name), not
  # necessarily its exposed port number. Resolve it before building the proxy URL.
  - name: Resolve the route service port
    ansible.builtin.set_fact:
      _virtctl_service_ports: >-
        {{ (r_virtctl_service.resources[0].spec.ports
            | selectattr('name', 'defined')
            | selectattr('name', 'equalto', r_virtctl_route.resources[0].spec.port.targetPort)
            | list)
           + (r_virtctl_service.resources[0].spec.ports
              | selectattr('targetPort', 'defined')
              | selectattr('targetPort', 'equalto', r_virtctl_route.resources[0].spec.port.targetPort)
              | list) }}

  - name: Require an unambiguous virtctl service port
    ansible.builtin.assert:
      that:
      - _virtctl_service_ports | map(attribute='port') | unique | list | length == 1
      fail_msg: "Could not resolve the virtctl route target to a unique service port."

  - name: Download virtctl through the Kubernetes API service proxy
    delegate_to: "{{ groups['bastions'][0] }}"
    ansible.builtin.get_url:
      url: >-
        {{ openshift_api_url | regex_replace('/+$', '') }}/api/v1/namespaces/openshift-cnv/services/http:{{
        r_virtctl_service.resources[0].metadata.name }}:{{ _virtctl_service_ports[0].port }}/proxy{{
        _ocp4_workload_openshift_virtualization_virtctl_url | urlsplit('path') }}
      headers:
        Authorization: "Bearer {{ openshift_api_key }}"
      unredirected_headers:
      - Authorization
      validate_certs: "{{ ocp4_workload_openshift_virtualization_virtctl_validate_certs }}"
      dest: /tmp/virtctl.tar.gz
      mode: "0660"
      force: true
      timeout: "{{ ocp4_workload_openshift_virtualization_virtctl_download_timeout }}"
    register: r_virtctl_api_download
    until: r_virtctl_api_download is succeeded
    retries: "{{ ocp4_workload_openshift_virtualization_virtctl_download_retries }}"
    delay: "{{ ocp4_workload_openshift_virtualization_virtctl_download_delay }}"
    no_log: true

  - name: Validate the API-provided virtctl archive
    ansible.builtin.include_tasks: validate_virtctl_archive.yml
