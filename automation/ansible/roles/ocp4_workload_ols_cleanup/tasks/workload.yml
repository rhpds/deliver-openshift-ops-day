---
# OLS is pre-configured at provisioning time. This role waits for
# lightspeed-app-server to be Ready before provisioning completes,
# ensuring students never log in during the startup window where the
# lightspeed-console-plugin is registered but the backend is still coming up.

- name: Check whether OLSConfig exists
  kubernetes.core.k8s_info:
    api_version: ols.openshift.io/v1alpha1
    kind: OLSConfig
    name: cluster
    namespace: openshift-lightspeed
  register: r_olsconfig_check
  ignore_errors: true

- name: Wait for lightspeed-app-server to be Ready
  when: r_olsconfig_check.resources | default([]) | length > 0
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: lightspeed-app-server
    namespace: openshift-lightspeed
  register: r_ols_server
  retries: 60
  delay: 30
  until: >-
    r_ols_server.resources | length > 0 and
    (r_ols_server.resources[0].status.readyReplicas | default(0)) > 0
  ignore_errors: true

- name: OLS readiness status
  debug:
    msg: >-
      {{
        'OLSConfig not found - OLS not installed, skipping wait'
        if r_olsconfig_check.resources | default([]) | length == 0
        else 'lightspeed-app-server ready - students can use OLS on first login'
        if (r_ols_server is defined and
            r_ols_server.resources | default([]) | length > 0 and
            (r_ols_server.resources[0].status.readyReplicas | default(0)) > 0)
        else 'WARNING: lightspeed-app-server did not become Ready within 30 minutes'
      }}

