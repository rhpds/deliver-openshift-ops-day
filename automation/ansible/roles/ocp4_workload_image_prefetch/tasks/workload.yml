---
- name: Apply image prefetch DaemonSet
  kubernetes.core.k8s:
    state: present
    namespace: "{{ ocp4_workload_image_prefetch_namespace }}"
    definition: "{{ lookup('template', 'image_prefetch_daemonset.yml.j2') | from_yaml }}"
  when: ocp4_workload_image_prefetch_images | length > 0

- name: Wait for image prefetch DaemonSet to finish pulling on all matching nodes
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    name: image-prefetch
    namespace: "{{ ocp4_workload_image_prefetch_namespace }}"
  register: ocp4_workload_image_prefetch_ds_info
  until:
  - ocp4_workload_image_prefetch_ds_info.resources | length > 0
  - ocp4_workload_image_prefetch_ds_info.resources[0].status.desiredNumberScheduled | default(0) > 0
  - (ocp4_workload_image_prefetch_ds_info.resources[0].status.numberReady | default(0)) ==
    (ocp4_workload_image_prefetch_ds_info.resources[0].status.desiredNumberScheduled | default(0))
  retries: 60
  delay: 20
  # Non-fatal: pulling several large images across every matching node can
  # take longer than this budget under registry/disk contention. The
  # dependent workload (e.g. the agentic OLS Deployment) typically isn't
  # created for a while yet - the pull keeps going in the background
  # regardless of this task's outcome, so a slow prefetch should never be
  # worse than no prefetch at all.
  ignore_errors: true
  when: ocp4_workload_image_prefetch_images | length > 0

# Leave this as the last task in the playbook.
# --------------------------------------------
- name: workload tasks complete
  debug:
    msg: "Workload Tasks completed successfully."
  when: not silent | bool
