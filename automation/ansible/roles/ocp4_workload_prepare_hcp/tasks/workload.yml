---
- name: Create namespace
  register: _ops_retry_prepare_hcp_0
  until: >-
    (_ops_retry_prepare_hcp_0 | deliver_openshift_ops_day.automation.ops_permanent_error) or ((_ops_retry_prepare_hcp_0
    is succeeded))
  retries: '{{ ops_day_api_retries | default(120) }}'
  delay: '{{ ops_day_retry_delay | default(10) }}'
  kubernetes.core.k8s:
    state: present
    api_version: v1
    kind: Namespace
    name: "{{ ocp4_workload_prepare_hcp_secret_namespace }}"

- name: Retrieve pull-secret from openshift-config namespace
  until: >-
    (r_pull_secret | deliver_openshift_ops_day.automation.ops_permanent_error) or (r_pull_secret |
    deliver_openshift_ops_day.automation.ops_data_ready(['.dockerconfigjson']))
  retries: '{{ ops_day_api_retries | default(120) }}'
  delay: '{{ ops_day_retry_delay | default(10) }}'
  no_log: true
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: pull-secret
    namespace: openshift-config
  register: r_pull_secret
- name: Extract .dockerconfigjson from pull-secret
  ansible.builtin.set_fact:
    pull_secret_json: "{{ r_pull_secret.resources[0].data['.dockerconfigjson'] | b64decode }}"

- name: Create secret on RHACM (copy of pull-secret)
  register: _ops_retry_prepare_hcp_3
  until: >-
    (_ops_retry_prepare_hcp_3 | deliver_openshift_ops_day.automation.ops_permanent_error) or ((_ops_retry_prepare_hcp_3
    is succeeded))
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ ocp4_workload_prepare_hcp_secret_name }}"
        namespace: "{{ ocp4_workload_prepare_hcp_secret_namespace }}"
        labels:
          cluster.open-cluster-management.io/credentials: ""
          cluster.open-cluster-management.io/type: kubevirt
      type: Opaque
      stringData:
        pullSecret: "{{ pull_secret_json }}"
  retries: 10
  delay: 10

- name: Create policies namespace
  register: _ops_retry_prepare_hcp_4
  until: >-
    (_ops_retry_prepare_hcp_4 | deliver_openshift_ops_day.automation.ops_permanent_error) or ((_ops_retry_prepare_hcp_4
    is succeeded))
  retries: '{{ ops_day_api_retries | default(120) }}'
  delay: '{{ ops_day_retry_delay | default(10) }}'
  kubernetes.core.k8s:
    state: present
    api_version: v1
    kind: Namespace
    name: "{{ ocp4_workload_prepare_hcp_policy_namespace }}"

- name: Create ManagedClusterSet and policy
  register: _ops_retry_prepare_hcp_5
  until: >-
    (_ops_retry_prepare_hcp_5 | deliver_openshift_ops_day.automation.ops_permanent_error) or ((_ops_retry_prepare_hcp_5
    is succeeded))
  retries: '{{ ops_day_api_retries | default(120) }}'
  delay: '{{ ops_day_retry_delay | default(10) }}'
  kubernetes.core.k8s:
    state: present
    template: "{{ item }}"
  loop:
  - managedclusterset.yaml.j2
  - managedclustersetbinding.yaml.j2
  - policy_gitops.yaml.j2
  - placement_gitops.yaml.j2
  - placementbinding_gitops.yaml.j2
  - policy_compliance.yaml.j2
  - placement_compliance.yaml.j2
  - placementbinding_compliance.yaml.j2

- name: Save user information
  agnosticd.core.agnosticd_user_info:
    data:
      hcp_secret: "{{ ocp4_workload_prepare_hcp_secret_name }}"
      hcp_secret_namespace: "{{ ocp4_workload_prepare_hcp_secret_namespace }}"
