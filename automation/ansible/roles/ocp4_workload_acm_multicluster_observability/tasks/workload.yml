---
- name: Setting up workload for user
  debug:
    msg: "Setting up workload for user ocp_username = {{ ocp_username }}"

- name: Create MultCluster Observability Namespace
  register: _ops_retry_acm_multicluster_observability_1
  until: >-
    (_ops_retry_acm_multicluster_observability_1 | deliver_openshift_ops_day.automation.ops_permanent_error)
    or ((_ops_retry_acm_multicluster_observability_1 is succeeded))
  retries: '{{ ops_day_api_retries | default(120) }}'
  delay: '{{ ops_day_retry_delay | default(10) }}'
  k8s:
    state: present
    definition: "{{ lookup('template','./templates/namespace_create.yml.j2') | from_yaml }}"

- name: Get pull-secret from openshift-config
  no_log: true
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: pull-secret
    namespace: openshift-config
  register: pullsecret
  retries: '{{ ops_day_readiness_retries | default(240) }}'
  delay: 5
  until: >-
    (pullsecret | deliver_openshift_ops_day.automation.ops_permanent_error) or (pullsecret | deliver_openshift_ops_day.automation.ops_data_ready(['.dockerconfigjson']))
- name: Get the original cred secrets
  set_fact:
    original_secret: "{{ item.data }}"
  with_items: "{{ pullsecret.resources }}"
  no_log: true

- name: Get the dockerconfigjson info
  no_log: true
  set_fact:
    secret_string: '{{ original_secret[".dockerconfigjson"] | b64decode | from_json }}'

- name: Create new secret
  register: _ops_retry_acm_multicluster_observability_5
  until: >-
    (_ops_retry_acm_multicluster_observability_5 | deliver_openshift_ops_day.automation.ops_permanent_error)
    or ((_ops_retry_acm_multicluster_observability_5 is succeeded))
  retries: '{{ ops_day_api_retries | default(120) }}'
  delay: '{{ ops_day_retry_delay | default(10) }}'
  no_log: true
  k8s:
    state: present
    definition:
      apiVersion: v1
      data:
        .dockerconfigjson: "{{ secret_string | to_json | b64encode }}"
      kind: Secret
      metadata:
        name: multiclusterhub-operator-pull-secret
        namespace: "{{ ocp4_workload_acm_multicluster_observability_namespace }}"
      type: kubernetes.io/dockerconfigjson

- name: Check ODF is ready
  # StorageCluster.status.phase can lag behind actual readiness on
  # external clusters and may never settle to Ready. The real
  # precondition for the Object Bucket Claim below is NooBaa readiness,
  # checked next, so this is a single informational query, not a gate.
  k8s_info:
    validate_certs: false
    api_version: ocs.openshift.io/v1
    kind: StorageCluster
    namespace: openshift-storage
  register: r_storagecluster
  ignore_errors: true

- name: Warn if ODF StorageCluster is not reporting Ready
  debug:
    msg: >-
      StorageCluster phase is
      {{ r_storagecluster.resources.0.status.phase | default('unknown') }},
      not Ready. Continuing since NooBaa readiness (checked next) is the
      actual precondition here.
  when: r_storagecluster.resources.0.status.phase | default('') != "Ready"

- name: Check NooBaa is ready
  k8s_info:
    validate_certs: false
    api_version: noobaa.io/v1alpha1
    kind: NooBaa
    name: noobaa
    namespace: openshift-storage
  register: r_noobaa
  until: >-
    (r_noobaa | deliver_openshift_ops_day.automation.ops_permanent_error) or ((r_noobaa | deliver_openshift_ops_day.automation.ops_ready)
    and (r_noobaa.resources[0].status.phase | default('') == 'Ready'))
  retries: '{{ ops_day_readiness_retries | default(40) }}'
  delay: 30

- name: Create Object Bucket Claim
  register: _ops_retry_acm_multicluster_observability_9
  until: >-
    (_ops_retry_acm_multicluster_observability_9 | deliver_openshift_ops_day.automation.ops_permanent_error)
    or ((_ops_retry_acm_multicluster_observability_9 is succeeded))
  retries: '{{ ops_day_api_retries | default(120) }}'
  delay: '{{ ops_day_retry_delay | default(10) }}'
  k8s:
    state: present
    definition: "{{ lookup('template','./templates/obc-observability.yml.j2') | from_yaml }}"

- name: Get Bucket information part 1
  k8s_info:
    api_version: v1
    kind: ConfigMap
    name: observer-bucket
    namespace: "{{ ocp4_workload_acm_multicluster_observability_namespace }}"
  register: r_bucket_cm
  retries: 120
  delay: 10
  until: >-
    (r_bucket_cm | deliver_openshift_ops_day.automation.ops_permanent_error) or (r_bucket_cm | deliver_openshift_ops_day.automation.ops_data_ready(['BUCKET_NAME',
    'BUCKET_HOST', 'BUCKET_PORT']))
- name: Get Bucket information part 2
  k8s_info:
    api_version: v1
    kind: Secret
    name: observer-bucket
    namespace: "{{ ocp4_workload_acm_multicluster_observability_namespace }}"
  register: r_bucket_secret
  retries: 120
  delay: 10
  until: >-
    (r_bucket_secret | deliver_openshift_ops_day.automation.ops_permanent_error) or (r_bucket_secret
    | deliver_openshift_ops_day.automation.ops_data_ready(['AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY']))
- name: Create Thanos Object Storage Secret
  register: _ops_retry_acm_multicluster_observability_12
  until: >-
    (_ops_retry_acm_multicluster_observability_12 | deliver_openshift_ops_day.automation.ops_permanent_error)
    or ((_ops_retry_acm_multicluster_observability_12 is succeeded))
  retries: '{{ ops_day_api_retries | default(120) }}'
  delay: '{{ ops_day_retry_delay | default(10) }}'
  no_log: true
  k8s:
    state: present
    definition: "{{ lookup('template','./templates/thanos-object-storage-secret.yml.j2') | from_yaml }}"

- name: Create MultiCluster Observability for ACM
  register: _ops_retry_acm_multicluster_observability_13
  until: >-
    (_ops_retry_acm_multicluster_observability_13 | deliver_openshift_ops_day.automation.ops_permanent_error)
    or ((_ops_retry_acm_multicluster_observability_13 is succeeded))
  retries: '{{ ops_day_api_retries | default(120) }}'
  delay: '{{ ops_day_retry_delay | default(10) }}'
  k8s:
    state: present
    definition: "{{ lookup('template','./templates/multiclusterobservability-cr.yml.j2') | from_yaml }}"

- name: workload tasks complete
  debug:
    msg: "Workload Tasks completed successfully."
  when: not silent | bool
