---
# ==============================================================================
# Apply KubeletConfig to lower image GC thresholds before workloads start.
# Default thresholds (85%/80%) leave too little headroom on compact 3-node
# clusters: by the time kubelet GC triggers, the cluster is already close to
# the eviction wall (~90%). Lowering to 75%/65% gives a 15% recovery buffer
# and prevents the eviction cascade that occurs during heavy image-pull windows.
#
# Also raise registryPullQPS/registryBurst (default 5/10). Rolling this
# KubeletConfig across the master pool evicts a large batch of pods that all
# share the same OCP release image at once; at the default pull rate that
# causes a 20-30+ minute "pull QPS exceeded" pile-up across unrelated
# operators (confirmed live on cluster-sb4fr: HyperConverged's webhook was
# one casualty of this, not the cause). Bumping to 15/30 let the same rollout
# complete with zero QPS-exceeded events on a repeat live test.
#
# This triggers a rolling restart of the master MachineConfigPool (one node at
# a time). We wait for the pool to fully update before continuing so that all
# subsequent workloads run on nodes with the correct kubelet settings.
# ==============================================================================

- name: Apply KubeletConfig to lower image GC thresholds on compact cluster nodes
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: machineconfiguration.openshift.io/v1
      kind: KubeletConfig
      metadata:
        name: compact-cluster-image-gc
      spec:
        machineConfigPoolSelector:
          matchLabels:
            pools.operator.machineconfiguration.openshift.io/master: ""
        kubeletConfig:
          imageGCHighThresholdPercent: 75
          imageGCLowThresholdPercent: 65
          registryPullQPS: 15
          registryBurst: 30
  register: r_kubelet_config
  until: >-
    (r_kubelet_config | deliver_openshift_ops_day.automation.ops_permanent_error) or ((r_kubelet_config
    is succeeded))
  retries: "{{ ops_day_api_retries | default(120) }}"
  delay: "{{ ops_day_retry_delay | default(10) }}"
  when: ACTION == "provision"

- name: Wait for KubeletConfig controller to observe and accept the applied generation
  kubernetes.core.k8s_info:
    api_version: machineconfiguration.openshift.io/v1
    kind: KubeletConfig
    name: compact-cluster-image-gc
  register: _ops_kubelet_ready
  until: >-
    (_ops_kubelet_ready | deliver_openshift_ops_day.automation.ops_permanent_error) or ((_ops_kubelet_ready
    | deliver_openshift_ops_day.automation.ops_ready('kubeletconfig')))
  retries: "{{ ops_day_readiness_retries | default(120) }}"
  delay: "{{ ops_day_retry_delay | default(10) }}"
  when: ACTION == "provision"

- name: Wait for MachineConfigPool master to begin rolling out new KubeletConfig
  kubernetes.core.k8s_info:
    api_version: machineconfiguration.openshift.io/v1
    kind: MachineConfigPool
    name: master
  register: r_mcp_updating
  retries: 18
  delay: 10
  until: >-
    (r_mcp_updating | deliver_openshift_ops_day.automation.ops_permanent_error) or ((r_mcp_updating
    is succeeded and r_mcp_updating.resources | default([]) | length > 0 and ( r_mcp_updating.resources[0].status.conditions
      | selectattr('type', 'equalto', 'Updating')
      | selectattr('status', 'equalto', 'True')
      | list | length > 0
    or (r_mcp_updating.resources[0].status.updatedMachineCount | default(0) | int)
      < (r_mcp_updating.resources[0].status.machineCount | default(1) | int)
    )))
  when:
    - ACTION == "provision"
    - r_kubelet_config is changed
  ignore_errors: true

- name: Wait for MachineConfigPool master to finish rolling update
  kubernetes.core.k8s_info:
    api_version: machineconfiguration.openshift.io/v1
    kind: MachineConfigPool
    name: master
  register: r_mcp_done
  retries: "{{ ops_day_preflight_pool_retries | default(90) }}"
  delay: 20
  until: >-
    (r_mcp_done | deliver_openshift_ops_day.automation.ops_permanent_error) or ((r_mcp_done | deliver_openshift_ops_day.automation.ops_ready('pool')))
  when: ACTION == "provision"

- name: Wait for nodes to finish configuration and return Ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
  register: _ops_preflight_nodes
  until: >-
    (_ops_preflight_nodes | deliver_openshift_ops_day.automation.ops_permanent_error) or ((_ops_preflight_nodes
    | deliver_openshift_ops_day.automation.ops_ready('nodes')))
  retries: "{{ ops_day_preflight_pool_retries | default(90) }}"
  delay: 20
  when: ACTION == "provision"

- name: Wait for OLM packageserver to recover after MCP rollout
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: ClusterOperator
    name: operator-lifecycle-manager-packageserver
  register: r_packageserver_co
  retries: "{{ ops_day_packageserver_retries | default(60) }}"
  delay: 20
  until: >-
    (r_packageserver_co | deliver_openshift_ops_day.automation.ops_permanent_error) or ((r_packageserver_co
    | deliver_openshift_ops_day.automation.ops_ready('packageserver')))
  when: ACTION == "provision"

- name: Pre-flight cluster cleanup - free disk before operator installs
  when: ACTION == "provision"
  ansible.builtin.include_role:
    name: deliver_openshift_ops_day.automation.ocp4_workload_cluster_cleanup

- name: Skip cleanup on destroy
  when: ACTION == "destroy"
  debug:
    msg: "Skipping cluster cleanup on destroy"
