---
# ==============================================================================
# DIAGNOSTICS - Cluster state before this workload
# ==============================================================================
- name: "DIAG - Cluster state checkpoint"
  shell: |
    echo "=== NODE USAGE ==="
    oc adm top nodes 2>/dev/null || echo "Metrics not available"
    echo ""
    echo "=== PODS: Running=$(oc get pods -A --field-selector=status.phase=Running --no-headers 2>/dev/null | wc -l) Pending=$(oc get pods -A --field-selector=status.phase=Pending --no-headers 2>/dev/null | wc -l) Failed=$(oc get pods -A --field-selector=status.phase=Failed --no-headers 2>/dev/null | wc -l) Total=$(oc get pods -A --no-headers 2>/dev/null | wc -l) ==="
    echo ""
    echo "=== PENDING PODS ==="
    oc get pods -A --field-selector=status.phase=Pending --no-headers 2>/dev/null | head -10 || echo "None"
    echo ""
    echo "=== CSVs NOT SUCCEEDED ==="
    oc get csv -A --no-headers 2>/dev/null | grep -v Succeeded | head -10 || echo "All succeeded"
    echo ""
    echo "=== PENDING PVCs ==="
    oc get pvc -A --field-selector=status.phase!=Bound --no-headers 2>/dev/null | head -10 || echo "All bound"
  register: diag_pre_workload
  ignore_errors: true

- name: "DIAG - Display pre-workload state"
  debug:
    msg: "{{ diag_pre_workload.stdout_lines | default(['no output']) }}"
  when: diag_pre_workload is defined
  ignore_errors: true

# ==============================================================================
# WORKLOAD with post-failure diagnostics
# ==============================================================================
- name: Run workload with failure capture
  block:
    - name: Wait for shared redhat-operators-snapshot CatalogSource to be READY
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: CatalogSource
        name: "{{ ocp4_workload_metallb_catalogsource_name }}"
        namespace: "{{ ocp4_workload_metallb_catalogsource_namespace }}"
      register: r_catalogsource
      until:
        - r_catalogsource is succeeded
        - r_catalogsource.resources | default([]) | length > 0
        - r_catalogsource.resources[0].status.connectionState.lastObservedState is defined
        - r_catalogsource.resources[0].status.connectionState.lastObservedState == "READY"
      retries: "{{ ocp4_workload_metallb_catalog_wait_retries }}"
      delay: "{{ ocp4_workload_metallb_retry_delay }}"
      when: ocp4_workload_metallb_use_catalog_snapshot | default(false) | bool

    - name: Install MetalLB Operator
      ansible.builtin.include_tasks: install_metallb.yml

    - name: Create the MetalLB instance
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', 'metallb.yaml') }}"
      register: _metallb_create
      until: _metallb_create is succeeded
      retries: "{{ ocp4_workload_metallb_create_retries }}"
      delay: "{{ ocp4_workload_metallb_retry_delay }}"

    - name: Wait until MetalLB is installed
      kubernetes.core.k8s_info:
        api_version: metallb.io/v1beta1
        kind: MetalLB
        name: metallb
        namespace: metallb-system
      # Retry the API query itself when a webhook/API temporarily disappears.
      register: _metallb_readiness
      vars:
        _metallb_conditions: >-
          {{ (_metallb_readiness.resources | default([]) | first | default({}))
             .get('status', {}).get('conditions', []) }}
      until:
        - _metallb_readiness is succeeded
        - _metallb_readiness.resources | default([]) | length == 1
        - >-
          _metallb_conditions | selectattr('type', 'defined')
          | selectattr('type', 'equalto', 'Available')
          | selectattr('status', 'defined') | map(attribute='status') | list == ['True']
      retries: "{{ ocp4_workload_metallb_readiness_retries }}"
      delay: "{{ ocp4_workload_metallb_retry_delay }}"

    - name: Create the IPAddressPool instance
      when: ocp4_workload_metallb_enable_ipaddresspool | default(false)
      kubernetes.core.k8s:
        state: present
        template: ipaddresspool.yaml.j2
      register: _metallb_ipaddresspool
      until: _metallb_ipaddresspool is succeeded
      retries: "{{ ocp4_workload_metallb_create_retries }}"
      delay: "{{ ocp4_workload_metallb_retry_delay }}"

    - name: Create the L2Advertisement instance
      when: ocp4_workload_metallb_enable_l2advertisement | default(false)
      kubernetes.core.k8s:
        state: present
        template: l2advertisement.yaml.j2
      register: _metallb_l2advertisement
      until: _metallb_l2advertisement is succeeded
      retries: "{{ ocp4_workload_metallb_create_retries }}"
      delay: "{{ ocp4_workload_metallb_retry_delay }}"


  rescue:
    - name: "DIAG - POST-FAILURE state for ocp4_workload_metallb"
      shell: |
        echo "====================================================================="
        echo "WORKLOAD FAILED: ocp4_workload_metallb"
        echo "====================================================================="
        echo ""
        echo "=== METALLB OLM STATE ==="
        oc get subscription,installplan,csv -n metallb-system 2>/dev/null || true
        echo ""
        echo "=== CATALOG CONNECTIONS ==="
        oc get catalogsource -A 2>/dev/null || true
        echo ""
        echo "=== NODE USAGE AT FAILURE ==="
        oc adm top nodes 2>/dev/null || echo "Metrics not available"
        echo ""
        echo "=== PODS BY PHASE ==="
        echo "Running: $(oc get pods -A --field-selector=status.phase=Running --no-headers 2>/dev/null | wc -l)"
        echo "Pending: $(oc get pods -A --field-selector=status.phase=Pending --no-headers 2>/dev/null | wc -l)"
        echo "Failed: $(oc get pods -A --field-selector=status.phase=Failed --no-headers 2>/dev/null | wc -l)"
        echo "Total: $(oc get pods -A --no-headers 2>/dev/null | wc -l)"
        echo ""
        echo "=== PENDING PODS ==="
        oc get pods -A --field-selector=status.phase=Pending -o custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name --no-headers 2>/dev/null | head -20 || echo "None"
        echo ""
        echo "=== CSVs NOT SUCCEEDED ==="
        oc get csv -A --no-headers 2>/dev/null | grep -v Succeeded | head -20 || echo "All succeeded"
        echo ""
        echo "=== PENDING PVCs ==="
        oc get pvc -A --field-selector=status.phase!=Bound --no-headers 2>/dev/null | head -10 || echo "All bound"
        echo ""
        echo "=== FAILEDSCHEDULING EVENTS ==="
        oc get events -A --field-selector reason=FailedScheduling --no-headers 2>/dev/null | tail -10 || echo "None"
        echo ""
        echo "=== IMAGE PULL ERRORS ==="
        oc get events -A --field-selector reason=Failed --no-headers 2>/dev/null | grep -i "pull\|image\|registry" | tail -10 || echo "None"
        echo ""
        echo "=== RECENT WARNINGS (last 20) ==="
        oc get events -A --field-selector type=Warning --sort-by='.lastTimestamp' --no-headers 2>/dev/null | tail -20 || echo "None"
      register: diag_post_failure
      ignore_errors: true

    - name: "DIAG - Display post-failure state"
      debug:
        msg: "{{ diag_post_failure.stdout_lines | default(['no output']) }}"
      when: diag_post_failure is defined
      ignore_errors: true

    - name: Fail with original error
      fail:
        msg: >-
          Workload ocp4_workload_metallb failed at
          {{ 'a task with no_log enabled' if (ansible_failed_task.no_log | default(false) | bool)
             else ansible_failed_task.name }}.
          See the original task failure and OLM diagnostics above.
          Raw failed results are deliberately not copied into this message.
