---
# ==============================================================================
# Compliance Operator Workload
#
# Installs the compliance operator if not already present. On clusters with ACM
# enabled, the prepare_hcp role (sovereign_cloud collection) deploys the
# compliance operator via an ACM OperatorPolicy. In that case, this role skips
# the install and just waits for everything to be ready.
#
# When ACM is not enabled (security module only), this role handles the full
# install via the upstream install_operator role.
# ==============================================================================

- name: Ensure openshift-compliance namespace exists
  kubernetes.core.k8s:
    state: present
    api_version: v1
    kind: Namespace
    name: "{{ ocp4_days_workload_compliance_operator_namespace }}"
  register: r_namespace
  until: r_namespace is successful
  retries: 10
  delay: 5

- name: Check for an existing compliance operator Subscription (e.g. by ACM policy)
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    name: compliance-operator
    namespace: "{{ ocp4_days_workload_compliance_operator_namespace }}"
  register: r_existing_subscription
  until: r_existing_subscription is succeeded
  retries: "{{ ocp4_days_workload_compliance_operator_api_retries }}"
  delay: "{{ ocp4_days_workload_compliance_operator_retry_delay }}"

- name: DEBUG - Existing installation check
  ansible.builtin.debug:
    msg: >-
      {{ 'Existing Subscription found — preserving its ownership and verifying installation below'
      if r_existing_subscription.resources | length > 0
      else 'No existing installation found — installing via install_operator role' }}

# Only call install_operator if the subscription doesn't already exist.
# When ACM is enabled, prepare_hcp creates the subscription via OperatorPolicy.
# Calling install_operator on top of that creates a duplicate OperatorGroup,
# which causes the CSV to fail with TooManyOperatorGroups.
- name: Install Compliance Operator
  when: r_existing_subscription.resources | length == 0
  ansible.builtin.include_tasks: install_compliance.yml

# A Subscription is intent, not proof of installation. This gate also handles
# subscriptions owned by ACM without creating a second OperatorGroup or
# changing their channel, catalog, or InstallPlan approval policy.
- name: Verify Compliance Operator installation and deployment
  ansible.builtin.include_tasks: operator_readiness.yml

- name: Wait for ProfileBundle CRDs to be available
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: profilebundles.compliance.openshift.io
  register: r_crd
  until:
    - r_crd is succeeded
    - r_crd.resources | default([]) | length > 0
  retries: "{{ ocp4_days_workload_compliance_operator_api_retries }}"
  delay: "{{ ocp4_days_workload_compliance_operator_retry_delay }}"

- name: DEBUG - ProfileBundle CRD available
  ansible.builtin.debug:
    msg: "ProfileBundle CRD is available"

- name: Wait for ProfileBundles to be parsed
  kubernetes.core.k8s_info:
    api_version: compliance.openshift.io/v1alpha1
    kind: ProfileBundle
    namespace: "{{ ocp4_days_workload_compliance_operator_namespace }}"
  register: r_profilebundles
  until:
    - r_profilebundles is succeeded
    - r_profilebundles.resources | default([]) | length >= 2
    - r_profilebundles.resources | default([]) | selectattr('status.dataStreamStatus', 'defined') | selectattr('status.dataStreamStatus', 'equalto', 'VALID') | list | length >= 2
  retries: "{{ ocp4_days_workload_compliance_operator_readiness_retries }}"
  delay: "{{ ocp4_days_workload_compliance_operator_retry_delay }}"

- name: DEBUG - ProfileBundle status
  ansible.builtin.debug:
    msg:
      - "ProfileBundles found: {{ r_profilebundles.resources | length }}"
      - "ProfileBundle names: {{ r_profilebundles.resources | map(attribute='metadata.name') | list }}"
      - "ProfileBundle statuses: {{ r_profilebundles.resources | map(attribute='status.dataStreamStatus') | list }}"

- name: Get pods in namespace
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ ocp4_days_workload_compliance_operator_namespace }}"
  register: r_pods

- name: DEBUG - Pods running
  ansible.builtin.debug:
    msg:
      - "Pods in namespace: {{ r_pods.resources | map(attribute='metadata.name') | list }}"
      - "Pod statuses: {{ r_pods.resources | map(attribute='status.phase') | list }}"

- name: Compliance Operator installation complete
  ansible.builtin.debug:
    msg: "Compliance Operator installed successfully. ProfileBundles are ready."
