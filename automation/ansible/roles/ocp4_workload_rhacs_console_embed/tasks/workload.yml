---
# ==============================================================================
# Expose RHACS Central via a native reencrypt route, for Showroom iframe
# ==============================================================================
# Problem:
#   RHACS Central sends X-Frame-Options: sameorigin and
#   content-security-policy: frame-ancestors 'self' in its HTTP responses.
#   The ocp4_workload_ocp_console_embed role configures the IngressController
#   to strip these headers, but that only works on edge/reencrypt routes —
#   not on the passthrough route the RHACS operator creates by default.
#   Result: Showroom cannot embed RHACS in an iframe tab.
#
# Fix:
#   Use the Central CR's own spec.central.exposure.route.reencrypt field so
#   the operator creates and owns a reencrypt route itself (named
#   "central-reencrypt"), instead of patching its default passthrough route
#   out-of-band. Patching the Route directly works too, but it leaves the
#   operator permanently fighting to restore its own passthrough default,
#   which fails validation (a passthrough Route can't carry our
#   certificate/key/destinationCACertificate fields) and shows up forever as
#   Irreconcilable: True / Progressing: True on the Central CR. Driving the
#   switch through the CR's own exposure field avoids that fight entirely.
#
# Sequencing:
#   The operator manages exactly one route.enabled flag that governs both its
#   default routes ("central" passthrough and "central-mtls" passthrough).
#   Flipping straight to reencrypt.enabled=true while route.enabled is still
#   true, or re-enabling reencrypt before the old "central" route's host
#   claim is actually released, leaves the new "central-reencrypt" route
#   stuck "HostAlreadyClaimed" — confirmed live on cluster-4pxwx on
#   2026-10-01. So this disables the default route first and waits for it to
#   fully disappear before enabling the native reencrypt route with the same
#   host.
#
# CA trust:
#   For reencrypt, HAProxy must verify Central's backend TLS cert. Central
#   may serve either a Let's Encrypt cert (from rhacs-central-tls, provisioned
#   by the platform) or a StackRox-signed cert (from central-tls). We provide
#   a combined destinationCACertificate containing:
#     1. The StackRox internal CA  — covers the StackRox-signed cert
#     2. The cluster trusted CA bundle — covers Let's Encrypt / any public CA
# ==============================================================================

- name: Get Central CR
  until: >-
    (r_central_cr | deliver_openshift_ops_day.automation.ops_permanent_error) or ((r_central_cr |
    deliver_openshift_ops_day.automation.ops_ready))
  retries: '{{ ops_day_api_retries | default(120) }}'
  delay: '{{ ops_day_retry_delay | default(10) }}'
  kubernetes.core.k8s_info:
    api_version: platform.stackrox.io/v1alpha1
    kind: Central
    namespace: stackrox
  register: r_central_cr
- name: Set Central CR name fact
  ansible.builtin.set_fact:
    _rhacs_central_cr_name: "{{ r_central_cr.resources[0].metadata.name }}"

- name: Skip if native reencrypt route is already configured
  when: r_central_cr.resources[0].spec.central.exposure.route.reencrypt.enabled | default(false)
  ansible.builtin.meta: end_role
- name: Set ephemeral-storage request on Central and Scanner so they aren't evicted first under disk pressure
  register: _ops_retry_rhacs_console_embed_3
  until: >-
    (_ops_retry_rhacs_console_embed_3 | deliver_openshift_ops_day.automation.ops_permanent_error)
    or ((_ops_retry_rhacs_console_embed_3 is succeeded))
  retries: '{{ ops_day_api_retries | default(120) }}'
  delay: '{{ ops_day_retry_delay | default(10) }}'
  kubernetes.core.k8s:
    state: patched
    api_version: platform.stackrox.io/v1alpha1
    kind: Central
    name: "{{ _rhacs_central_cr_name }}"
    namespace: stackrox
    definition:
      spec:
        central:
          resources:
            requests:
              ephemeral-storage: 1Gi
        scanner:
          analyzer:
            resources:
              requests:
                ephemeral-storage: 500Mi

- name: Get cluster ingress domain
  until: >-
    (r_cluster_ingress | deliver_openshift_ops_day.automation.ops_permanent_error) or ((r_cluster_ingress
    | deliver_openshift_ops_day.automation.ops_ready))
  retries: '{{ ops_day_api_retries | default(120) }}'
  delay: '{{ ops_day_retry_delay | default(10) }}'
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: r_cluster_ingress
- name: Set Central reencrypt host fact
  ansible.builtin.set_fact:
    _rhacs_central_reencrypt_host: "central-stackrox.{{ r_cluster_ingress.resources[0].spec.domain }}"

- name: Get ingress controller default certificate name
  until: >-
    (r_ingress_controller | deliver_openshift_ops_day.automation.ops_permanent_error) or ((r_ingress_controller
    | deliver_openshift_ops_day.automation.ops_ready))
  retries: '{{ ops_day_api_retries | default(120) }}'
  delay: '{{ ops_day_retry_delay | default(10) }}'
  no_log: true
  kubernetes.core.k8s_info:
    api_version: operator.openshift.io/v1
    kind: IngressController
    name: default
    namespace: openshift-ingress-operator
  register: r_ingress_controller
- name: Get ingress certificate secret
  until: >-
    (r_ingress_cert_secret | deliver_openshift_ops_day.automation.ops_permanent_error) or (r_ingress_cert_secret
    | deliver_openshift_ops_day.automation.ops_data_ready(['tls.crt', 'tls.key']))
  retries: '{{ ops_day_api_retries | default(120) }}'
  delay: '{{ ops_day_retry_delay | default(10) }}'
  no_log: true
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ r_ingress_controller.resources[0].spec.defaultCertificate.name | default('router-certs-default') }}"
    namespace: openshift-ingress
  register: r_ingress_cert_secret
- name: Get StackRox central TLS secret (internal CA)
  until: >-
    (r_central_tls_secret | deliver_openshift_ops_day.automation.ops_permanent_error) or (r_central_tls_secret
    | deliver_openshift_ops_day.automation.ops_data_ready(['ca.pem']))
  retries: '{{ ops_day_api_retries | default(120) }}'
  delay: '{{ ops_day_retry_delay | default(10) }}'
  no_log: true
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: central-tls
    namespace: stackrox
  register: r_central_tls_secret
- name: Get cluster trusted CA bundle (public root CAs)
  until: >-
    (r_trusted_ca_bundle | deliver_openshift_ops_day.automation.ops_permanent_error) or (r_trusted_ca_bundle
    | deliver_openshift_ops_day.automation.ops_data_ready(['ca-bundle.crt']))
  retries: '{{ ops_day_api_retries | default(120) }}'
  delay: '{{ ops_day_retry_delay | default(10) }}'
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: trusted-ca-bundle
    namespace: openshift-config-managed
  register: r_trusted_ca_bundle
- name: Build combined destination CA certificate
  ansible.builtin.set_fact:
    _rhacs_combined_destination_ca: >-
      {{ r_central_tls_secret.resources[0].data['ca.pem'] | b64decode }}
      {{ r_trusted_ca_bundle.resources[0].data['ca-bundle.crt'] | default('') }}

- name: Disable Central operator's default routes
  register: _ops_retry_rhacs_console_embed_11
  until: >-
    (_ops_retry_rhacs_console_embed_11 | deliver_openshift_ops_day.automation.ops_permanent_error)
    or ((_ops_retry_rhacs_console_embed_11 is succeeded))
  retries: '{{ ops_day_api_retries | default(120) }}'
  delay: '{{ ops_day_retry_delay | default(10) }}'
  kubernetes.core.k8s:
    state: patched
    api_version: platform.stackrox.io/v1alpha1
    kind: Central
    name: "{{ _rhacs_central_cr_name }}"
    namespace: stackrox
    definition:
      spec:
        central:
          exposure:
            route:
              enabled: false

# job_256674 (cluster-mr7n5) failed here after only 60s (12x5s): the operator
# hadn't deleted the "central"/"central-mtls" Route objects yet (fatal payload
# showed both still present, created at the same timestamp the disable patch
# was applied) - it just needed more time to reconcile the route.enabled=false
# change. Widen the budget to tolerate slower operator reconciliation.
- name: Wait for default routes to be fully removed
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: stackrox
  register: r_stackrox_routes
  retries: '{{ ops_day_readiness_retries | default(120) }}'
  delay: 10
  until: >-
    (r_stackrox_routes | deliver_openshift_ops_day.automation.ops_permanent_error) or ((r_stackrox_routes
    is succeeded) and (r_stackrox_routes.resources | default([]) | selectattr('metadata.name', 'in',
    ['central', 'central-mtls']) | list | length == 0))
- name: Enable native reencrypt route with combined CA trust
  register: _ops_retry_rhacs_console_embed_13
  until: >-
    (_ops_retry_rhacs_console_embed_13 | deliver_openshift_ops_day.automation.ops_permanent_error)
    or ((_ops_retry_rhacs_console_embed_13 is succeeded))
  retries: '{{ ops_day_api_retries | default(120) }}'
  delay: '{{ ops_day_retry_delay | default(10) }}'
  kubernetes.core.k8s:
    state: patched
    api_version: platform.stackrox.io/v1alpha1
    kind: Central
    name: "{{ _rhacs_central_cr_name }}"
    namespace: stackrox
    definition:
      spec:
        central:
          exposure:
            route:
              enabled: false
              reencrypt:
                enabled: true
                host: "{{ _rhacs_central_reencrypt_host }}"
                tls:
                  certificate: "{{ r_ingress_cert_secret.resources[0].data['tls.crt'] | b64decode }}"
                  key: "{{ r_ingress_cert_secret.resources[0].data['tls.key'] | b64decode }}"
                  destinationCACertificate: "{{ _rhacs_combined_destination_ca }}"

# Old budget (12 x 5s = 60s) assumed the operator would reconcile the CR
# patch into an admitted Route well within that window. Confirmed on
# cluster-fpwbg on 2026-11-12: the route's own creationTimestamp was 14:24:21Z,
# about 17s after this task's budget had already expired at ~14:24:04Z.
# Widened with headroom over that single data point.
- name: Wait for reencrypt route to be admitted
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: central-reencrypt
    namespace: stackrox
  register: r_central_route
  retries: '{{ ops_day_readiness_retries | default(120) }}'
  delay: 10
  until: >-
    (r_central_route | deliver_openshift_ops_day.automation.ops_permanent_error) or ((r_central_route
    | deliver_openshift_ops_day.automation.ops_ready('route', _rhacs_central_reencrypt_host)))
- name: Verify Central is reachable after route switch
  ansible.builtin.uri:
    url: "https://{{ _rhacs_central_reencrypt_host }}/v1/ping"
    method: GET
    validate_certs: false
    status_code: [200, 401]
  register: r_central_verify
  retries: '{{ ops_day_readiness_retries | default(80) }}'
  delay: 15
  until: >-
    (r_central_verify | deliver_openshift_ops_day.automation.ops_permanent_error) or ((r_central_verify
    is succeeded) and (r_central_verify.status | default(-1) in [200, 401]))
- name: Report result
  debug:
    msg: >-
      Central exposed via native reencrypt route.
      Host: {{ _rhacs_central_reencrypt_host }},
      Termination: {{ r_central_route.resources[0].spec.tls.termination }}
