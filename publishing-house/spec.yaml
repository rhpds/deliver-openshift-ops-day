# Publishing House — Project Spec
# Lifecycle: intake → content_review → infra_review → jira_sync → development → ready → published
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json
# Stage is managed by SonataFlow and cached in .ph-state — do not edit stage.current manually.
# NOTE: This file is also in the template repo. The Scaffolder overlays project.* values.
# TODO: Eliminate this copy — Scaffolder should pull from template repo directly.

project:
  slug: "deliver-openshift-ops-day"
  owner_email: "jgavant@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "new"
  automation_type: "ansible"
  description: "An overview of the OpenShift Ops Day Roadshow workshop including its features and how to deliver it and an opportunity to try important modules."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1196"
  workflow_id: "5498fbed-df06-45ee-8e4c-21142a5d5540"

spec:
  title: "Deliver the OpenShift Ops Day Roadshow"
  learning_objectives:
    - "Describe the OpenShift Ops Day Roadshow's structure, value propositions, and delivery formats"
    - "Identify how to position the Roadshow for different customer scenarios (single-day, regional event, individual sessions)"
    - "Demonstrate the delivery workflow for a Roadshow module including supporting materials, live walkthrough, student work time, and reviews"
    - "Describe the high-level background and purpose of all 18 modules in the workshop"
    - "Demonstrate delivery of application management and troubleshooting content including cluster verification, application deployment, and debugging"
    - "Demonstrate delivery of observability content including metrics with Prometheus, logs with Loki, and traces with OpenTelemetry"
  modules:
    - id: module-01
      title: "What Is the OpenShift Roadshow?"
      duration_min: 15
      status: not_started
    - id: module-02
      title: "Positioning and Scheduling the Roadshow"
      duration_min: 15
      status: not_started
    - id: module-03
      title: "How to Deliver a Module"
      duration_min: 30
      status: not_started
    - id: module-04
      title: "Application Management Hands-On"
      duration_min: 30
      status: not_started
    - id: module-05
      title: "Observability Hands-On"
      duration_min: 30
      status: not_started
  environment:
    platform: ""               # ocp | rhel-vms — determines which sizing fields apply
    topology: ""               # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: ""                 # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services: []              # named external service dependencies e.g. [github.com]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 2
  audience: "intermediate"   # beginner | intermediate | advanced

development:
  automation:
    ansible:
      status: not_started
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: ""
    catalog_gap: ""
    design_overview: "Prepares Red Hat field teams to deliver the OpenShift Ops Day Roadshow by covering the workshop structure, positioning, and delivery techniques, followed by hands-on exercises in application management and observability."
    module_summaries:
      - title: "What Is the OpenShift Roadshow?"
        overview: "Overview of the Roadshow's structure, content modules, and value propositions for customers."
      - title: "Positioning and Scheduling the Roadshow"
        overview: "How to position the Roadshow for different customer scenarios and schedule it on RHDP."
      - title: "How to Deliver a Module"
        overview: "The delivery workflow: supporting materials, live walkthrough, student work time, and reviews."
      - title: "Application Management Hands-On"
        overview: "Hands-on exercises verifying cluster health, deploying an application, and troubleshooting failures."
      - title: "Observability Hands-On"
        overview: "Hands-on exercises with Prometheus metrics, Loki logs, and OpenTelemetry/Tempo traces."
    rcars_overlap_pct: null
    rcars_top_matches: []
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
