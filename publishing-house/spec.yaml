# Publishing House — Project Spec
# Lifecycle: intake → content_review → infra_review → jira_sync → development → ready → published
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json
# Stage is managed by SonataFlow and cached in .ph-state — do not edit stage.current manually.
# NOTE: This file is also in the template repo. The Scaffolder overlays project.* values.
# TODO: Eliminate this copy — Scaffolder should pull from template repo directly.

project:
  slug: "deliver-openshift-ops-day"
  owner_email: "jgavant@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "new"
  automation_type: "ansible"
  description: "Overview and delivery guidance for the OpenShift Ops Day roadshow; and a walkthrough of the Observability, Zero Trust Workload Identity Manager and Secrets Management modules."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1196"
  workflow_id: "5498fbed-df06-45ee-8e4c-21142a5d5540"

spec:
  title: "Deliver the OpenShift Ops Day Roadshow"
  learning_objectives:
    - "Learn about the OpenShift Ops Day Roadshow's structure, content, value propositions, and delivery formats"
    - "Deliver a workshop module including supporting materials, lab setup, live walkthroughs and student work time"
    - "Deliver a module on observability in OpenShift including metrics with Prometheus, logs with Loki and traces with OpenTelemetry"
    - "Deliver a module on Zero Trust Workload Identity Manager for passwordless service authentication"
    - "Deliver a module on secrets management with Hashicorp Vault and External Secrets Operator"
  modules:
    - id: module-01
      title: "Position and deliver the workshop"
      duration_min: 25
      status: not_started
    - id: module-02
      title: "Observability in OpenShift"
      duration_min: 30
      status: not_started
    - id: module-03
      title: "Zero Trust Workload Identity Manager"
      duration_min: 30
      status: not_started
    - id: module-04
      title: "Secrets management with Vault and External Secrets Operator"
      duration_min: 30
      status: not_started
  environment:
    platform: "ocp"
    topology: "per-student"
    cloud_provider: cnv
    max_concurrent_users: 100

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.20"
    cluster_type: "multinode"
    control_plane_instance_count: 3
    control_plane_cpu: 16
    control_plane_ram_gb: 64
    worker_count: 0
    worker_cpu: 0
    worker_ram_gb: 0
    worker_disk_gb: 0

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""
    ai_requirement: "none"
    ai_model_tier: ""
    ai_model_name: ""
    ai_justification: ""
    non_ga_products: []
    non_ga_access_plan: ""
    external_services:
      - "registry.redhat.io"
      - "registry.connect.redhat.com"
    gpu_nodes: 0
    gpu_type: ""
  duration_hours: 2
  audience: "intermediate"   # beginner | intermediate | advanced

development:
  automation:
    ansible:
      status: not_started
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: ""
    catalog_gap: "The existing Roadshow provides participant-facing hands-on content but nothing in the catalog addresses the train-the-trainer layer — how field teams should position, schedule, and deliver the Roadshow to customers."
    design_overview: "Prepares Red Hat field teams to deliver the OpenShift Ops Day Roadshow by covering the workshop structure, positioning, and delivery techniques, followed by hands-on exercises in observability, Zero Trust Workload Identity Manager, and secrets management."
    module_summaries:
      - title: "Position and Deliver the Workshop"
        overview: "Introduction to the Roadshow, its value propositions and delivery formats, and end-to-end guidance on delivering the workshop to customers."
      - title: "Observability in OpenShift"
        overview: "Hands-on walkthrough of metrics with Prometheus, logs with Vector and Loki, and distributed tracing with OpenTelemetry and Tempo."
      - title: "Zero Trust Workload Identity Manager"
        overview: "Hands-on walkthrough of ZTWIM for passwordless service-to-service authentication on OpenShift."
      - title: "Secrets Management with Vault and ESO"
        overview: "Hands-on walkthrough of Hashicorp Vault and External Secrets Operator for centralized secrets management."
    rcars_overlap_pct: 87
    rcars_top_matches:
      - title: "OpenShift Ops Day Roadshow"
        ci_name: "published.openshift-days-ops-track.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.openshift-days-ops-track.prod"
        relevance_score: 87
        why_it_fits: "This is the actual OpenShift Ops Day Roadshow workshop content — the same modules this lab teaches people to deliver."
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
